[package]
name = "hybridkem"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Educational FIPS 203 ML-KEM from the spec, an X25519+ML-KEM hybrid combiner, and a Noise-style post-quantum handshake (not audited)"
publish = false

[dependencies]
sha3 = "=0.12.0"
shake = "=0.1.0"
log = "=0.4.34"
x25519-dalek = { version = "=3.0.0", features = ["static_secrets"] }
chacha20poly1305 = "=0.11.0"
hkdf = "=0.13.0"
sha2 = "=0.11.1"
subtle = "=2.6.1"
zeroize = { version = "=1.9.1", features = ["derive"] }
rand_core = "=0.10.1"
rand = "=0.10.3"
hex = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
clap = { version = "=4.6.7", features = ["derive"] }
thiserror = "=2.0.21"

[dev-dependencies]
ml-kem = { version = "=0.3.3", features = ["hazmat"] }
x-wing = { version = "=0.1.1", features = ["hazmat"] }
proptest = "=1.12.0"
criterion = "=0.8.2"

[[bench]]
name = "kem"
harness = false

[profile.release]
debug = false
lto = "thin"
codegen-units = 1
